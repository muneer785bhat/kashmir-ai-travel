<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Activity | Kashmir AI Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f5;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #14532d;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #16a34a;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button,
        .back-button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            background: #15803d;
            color: white;
        }

        button:hover {
            background: #166534;
        }

        .back-button {
            background: #e5e7eb;
            color: #374151;
        }

        .back-button:hover {
            background: #d1d5db;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Activity</h1>

        <p class="subtitle">
            Update activity information.
        </p>

        <form method="POST">

            <!-- Destination -->

            <label for="destination_id">
                Destination
            </label>

            <select
                name="destination_id"
                id="destination_id"
                required
            >

                {% for destination in destinations %}

                <option
                    value="{{ destination['id'] }}"
                    {% if destination['id'] == activity['destination_id'] %}
                    selected
                    {% endif %}
                >
                    {{ destination['name'] }}
                </option>

                {% endfor %}

            </select>


            <!-- Activity Name -->

            <label for="name">
                Activity Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ activity['name'] }}"
                required
            >


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ activity['category'] or '' }}"
                placeholder="Example: Adventure"
            >


            <!-- Description -->

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe this activity..."
            >{{ activity['description'] or '' }}</textarea>


            <!-- Season -->

            <label for="season">
                Best Season
            </label>

            <input
                type="text"
                id="season"
                name="season"
                value="{{ activity['season'] or '' }}"
                placeholder="Example: December to March"
            >


            <!-- Buttons -->

            <div class="buttons">

                <button type="submit">
                    💾 Save Changes
                </button>

                <a
                    href="/admin"
                    class="back-button"
                >
                    ← Back to Admin
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>

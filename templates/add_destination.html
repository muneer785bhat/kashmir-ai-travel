<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Destination | Kashmir AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            margin: 0;
            background: #f4f7f4;
            font-family: Arial, sans-serif;
            color: #20352a;
        }

        .form-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 25px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            border: 1px solid #dfe7e1;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718078;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #d9e3dc;
            border-radius: 10px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4c8064;
        }

        .image-help {
            color: #718078;
            font-size: 11px;
            margin-top: 6px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .back-button {
            padding: 13px 22px;
            border-radius: 25px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
        }

        button {
            background: #214d38;
            color: white;
        }

        .back-button {
            background: #eaf2ec;
            color: #214d38;
        }

        .error {
            padding: 12px;
            border-radius: 10px;
            background: #fff0f0;
            color: #a33a3a;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="form-container">

    <div class="form-card">

        <h1>
            🏔️ Add Destination
        </h1>

        <p class="subtitle">
            Add a new Kashmir destination to your platform.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            enctype="multipart/form-data">


            <label for="name">
                Destination Name
            </label>

            <input
                id="name"
                type="text"
                name="name"
                placeholder="Example: Yusmarg"
                required>


            <label for="location">
                Location
            </label>

            <input
                id="location"
                type="text"
                name="location"
                placeholder="Example: Budgam, Kashmir"
                required>


            <label for="category">
                Category
            </label>

            <input
                id="category"
                type="text"
                name="category"
                placeholder="Example: Nature"
                required>


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe the destination..."
                required></textarea>


            <label for="best_time">
                Best Time to Visit
            </label>

            <input
                id="best_time"
                type="text"
                name="best_time"
                placeholder="Example: April to October"
                required>


            <label for="image">
                Destination Image
            </label>

            <input
                id="image"
                type="file"
                name="image"
                accept="image/jpeg,image/png,image/webp">

            <p class="image-help">
                JPG, PNG or WEBP recommended.
            </p>


            <div class="buttons">

                <button type="submit">
                    ➕ Add Destination
                </button>

                <a
                    href="/admin"
                    class="back-button">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
